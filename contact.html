      <!---Sorry, I am NOT putting my school email on the internet for it to get scraped and more spam gets sent to it.-->
    <form id="contact-form" class="form" method="get">
      <label>Name:<input name="submitted-name" autocomplete="name" required></label>
      <br>
      <label>Email:<input name="submitted-email" type="email" autocomplete="email" required></label>
      <br>
      <label>Message:<br><textarea id="message" name="message" rows="10" cols="50" placeholder="Type your message here..." required></textarea></label>
      <br>  
      <button onclick="alert('Form submitted!')">Send</button>
